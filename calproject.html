<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables for Light & Dark Themes */
        :root {
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --bg-keypad: rgba(248, 250, 252, 0.6);
            --bg-history: rgba(248, 250, 252, 0.95);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            
            /* Button Colors - Light */
            --btn-num-bg: #ffffff;
            --btn-num-text: #1e293b;
            --btn-num-border: rgba(226, 232, 240, 0.8);
            --btn-num-hover: #f8fafc;

            --btn-util-bg: rgba(226, 232, 240, 0.7);
            --btn-util-text: #334155;
            --btn-util-hover: rgba(203, 213, 225, 0.8);

            --btn-op-bg: #e0e7ff;
            --btn-op-text: #4f46e5;
            --btn-op-hover: #c7d2fe;

            --btn-clear-bg: #ffe4e6;
            --btn-clear-text: #e11d48;
            --btn-clear-hover: #fecdd3;

            --btn-eq-bg: #4f46e5;
            --btn-eq-text: #ffffff;
            --btn-eq-hover: #4338ca;
            --btn-eq-shadow: rgba(99, 102, 241, 0.35);

            --icon-hover-bg: #f1f5f9;
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* Dark Theme Overrides */
        html.dark {
            --bg-page: #020617;
            --bg-card: #0f172a;
            --bg-keypad: rgba(15, 23, 42, 0.5);
            --bg-history: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #1e293b;

            /* Button Colors - Dark */
            --btn-num-bg: rgba(30, 41, 59, 0.65);
            --btn-num-text: #ffffff;
            --btn-num-border: rgba(51, 65, 85, 0.5);
            --btn-num-hover: #1e293b;

            --btn-util-bg: #1e293b;
            --btn-util-text: #cbd5e1;
            --btn-util-hover: #334155;

            --btn-op-bg: rgba(30, 27, 75, 0.85);
            --btn-op-text: #818cf8;
            --btn-op-hover: rgba(49, 46, 129, 0.9);

            --btn-clear-bg: rgba(76, 5, 25, 0.65);
            --btn-clear-text: #fb7185;
            --btn-clear-hover: rgba(136, 19, 55, 0.7);

            --icon-hover-bg: #1e293b;
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
        }

        /* Base & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Outer Wrapper */
        .wrapper {
            width: 100%;
            max-width: 24rem;
        }

        /* Back Button Outside Calculator */
        .back-container {
            margin-bottom: 0.75rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.5rem 0.875rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-primary);
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .back-btn:hover {
            background-color: var(--btn-num-hover);
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        /* Main Calculator Card */
        .calculator-card {
            width: 100%;
            background-color: var(--bg-card);
            border-radius: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Header */
        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem 0.5rem;
        }

        .brand-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: transparent;
            border: none;
            padding: 0.5rem;
            border-radius: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .icon-btn:hover {
            background-color: var(--icon-hover-bg);
        }

        /* Theme Icons Visibility */
        .icon-sun {
            display: none;
            color: #fbbf24;
        }

        .icon-moon {
            display: block;
        }

        html.dark .icon-sun {
            display: block;
        }

        html.dark .icon-moon {
            display: none;
        }

        /* Display Area */
        .display-area {
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            height: 8rem;
            position: relative;
            word-break: break-all;
        }

        .toast {
            position: absolute;
            top: 0.25rem;
            left: 1.5rem;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        .previous-operand {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            height: 1.5rem;
            overflow: hidden;
        }

        .current-operand {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin-top: 0.25rem;
            cursor: pointer;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.2s ease, font-size 0.15s ease;
        }

        .current-operand:hover {
            opacity: 0.8;
        }

        .current-operand.compact {
            font-size: 1.85rem;
        }

        /* History Drawer */
        .history-panel {
            display: none;
            background-color: var(--bg-history);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            max-height: 12rem;
            overflow-y: auto;
        }

        .history-panel.open {
            display: block;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .history-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .clear-history-btn {
            background: none;
            border: none;
            font-size: 0.75rem;
            color: #f43f5e;
            cursor: pointer;
        }

        .clear-history-btn:hover {
            text-decoration: underline;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.875rem;
            text-align: right;
        }

        .history-empty {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 0.5rem 0;
        }

        .history-item {
            padding: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .history-item:hover {
            background-color: var(--icon-hover-bg);
        }

        .history-expr {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .history-res {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Keypad Grid */
        .keypad {
            padding: 1.25rem;
            background-color: var(--bg-keypad);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .calc-btn {
            padding: 1rem;
            border-radius: 1rem;
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 600;
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }

        .calc-btn:active {
            transform: scale(0.95);
        }

        /* Button Variants */
        .btn-num {
            background-color: var(--btn-num-bg);
            color: var(--btn-num-text);
            border-color: var(--btn-num-border);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .btn-num:hover {
            background-color: var(--btn-num-hover);
        }

        .btn-util {
            background-color: var(--btn-util-bg);
            color: var(--btn-util-text);
            font-size: 1.125rem;
        }

        .btn-util:hover {
            background-color: var(--btn-util-hover);
        }

        .btn-op {
            background-color: var(--btn-op-bg);
            color: var(--btn-op-text);
        }

        .btn-op:hover {
            background-color: var(--btn-op-hover);
        }

        .btn-clear {
            background-color: var(--btn-clear-bg);
            color: var(--btn-clear-text);
            font-size: 1.125rem;
        }

        .btn-clear:hover {
            background-color: var(--btn-clear-hover);
        }

        .btn-equals {
            background-color: var(--btn-eq-bg);
            color: var(--btn-eq-text);
            box-shadow: 0 10px 15px -3px var(--btn-eq-shadow);
        }

        .btn-equals:hover {
            background-color: var(--btn-eq-hover);
        }

        /* SVG Sizing */
        .icon-sm {
            width: 1rem;
            height: 1rem;
        }

        .icon-md {
            width: 1.25rem;
            height: 1.25rem;
        }

        .icon-lg {
            width: 1.5rem;
            height: 1.5rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 400px) {
            .keypad {
                padding: 1rem;
                gap: 0.6rem;
            }
            .calc-btn {
                padding: 0.875rem;
                font-size: 1.125rem;
            }
            .current-operand {
                font-size: 2.25rem;
            }
            .current-operand.compact {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Outer Wrapper for Back Button + Calculator -->
    <div class="wrapper">
        <!-- Back Button Outside the Calculator -->
        <div class="back-container">
            <a href="projectpage.html" id="back-link" aria-label="Go Back" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>Back</span>
            </a>
        </div>

        <!-- Main Calculator Container -->
        <div class="calculator-card">
            
            <!-- Top Header: Title, Theme Toggle & History Toggle -->
            <div class="calc-header">
                <span class="brand-label">Calc Pro</span>
                <div class="header-actions">
                    <!-- History Toggle Button -->
                    <button id="history-toggle" aria-label="Toggle History" class="icon-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>
                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle" aria-label="Toggle Dark Mode" class="icon-btn">
                        <!-- Sun Icon (shown in dark mode) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon-md icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <!-- Moon Icon (shown in light mode) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon-md icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Display Area -->
            <div class="display-area">
                <!-- Notification Toast -->
                <div id="toast" class="toast">Copied to clipboard!</div>

                <!-- Previous Operand / Equation -->
                <div id="previous-operand" class="previous-operand"></div>
                
                <!-- Current Operand (Click to copy) -->
                <div id="current-operand" title="Click to copy" class="current-operand">0</div>
            </div>

            <!-- Collapsible History Drawer -->
            <div id="history-panel" class="history-panel">
                <div class="history-header">
                    <span class="history-title">Calculation History</span>
                    <button id="clear-history" class="clear-history-btn">Clear</button>
                </div>
                <ul id="history-list" class="history-list">
                    <li class="history-empty">No history yet</li>
                </ul>
            </div>

            <!-- Keypad Grid -->
            <div class="keypad">
                <!-- Row 1 -->
                <button data-action="clear" class="calc-btn btn-clear">AC</button>
                <button data-action="delete" class="calc-btn btn-util" aria-label="Backspace">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                    </svg>
                </button>
                <button data-action="percent" class="calc-btn btn-util">%</button>
                <button data-operation="÷" class="calc-btn btn-op">÷</button>

                <!-- Row 2 -->
                <button data-number="7" class="calc-btn btn-num">7</button>
                <button data-number="8" class="calc-btn btn-num">8</button>
                <button data-number="9" class="calc-btn btn-num">9</button>
                <button data-operation="×" class="calc-btn btn-op">×</button>

                <!-- Row 3 -->
                <button data-number="4" class="calc-btn btn-num">4</button>
                <button data-number="5" class="calc-btn btn-num">5</button>
                <button data-number="6" class="calc-btn btn-num">6</button>
                <button data-operation="-" class="calc-btn btn-op">−</button>

                <!-- Row 4 -->
                <button data-number="1" class="calc-btn btn-num">1</button>
                <button data-number="2" class="calc-btn btn-num">2</button>
                <button data-number="3" class="calc-btn btn-num">3</button>
                <button data-operation="+" class="calc-btn btn-op">+</button>

                <!-- Row 5 -->
                <button data-action="negate" class="calc-btn btn-num">±</button>
                <button data-number="0" class="calc-btn btn-num">0</button>
                <button data-number="." class="calc-btn btn-num">.</button>
                <button data-action="equals" class="calc-btn btn-equals">=</button>
            </div>
        </div>
    </div>

    <!-- Standalone Vanilla JavaScript -->
    <script>
        /**
         * Calculator Class encapsulating state, math logic, and display formatting
         */
        class Calculator {
            constructor(previousOperandTextElement, currentOperandTextElement) {
                this.previousOperandTextElement = previousOperandTextElement;
                this.currentOperandTextElement = currentOperandTextElement;
                this.history = [];
                this.clear();
            }

            // Reset calculator state
            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.shouldResetScreen = false;
            }

            // Delete last digit
            delete() {
                if (this.shouldResetScreen) return;
                if (this.currentOperand === 'Error') {
                    this.clear();
                    return;
                }
                if (this.currentOperand.length === 1 || (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.toString().slice(0, -1);
                }
            }

            // Append number or decimal point
            appendNumber(number) {
                if (this.currentOperand === 'Error') this.clear();
                
                if (this.shouldResetScreen) {
                    this.currentOperand = '';
                    this.shouldResetScreen = false;
                }

                // Prevent multiple decimals
                if (number === '.' && this.currentOperand.includes('.')) return;
                
                // Handle leading zero
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else if (this.currentOperand === '' && number === '.') {
                    this.currentOperand = '0.';
                } else {
                    // Limit input length to prevent overflow
                    if (this.currentOperand.replace(/[^0-9]/g, '').length >= 15) return;
                    this.currentOperand = this.currentOperand.toString() + number.toString();
                }
            }

            // Toggle positive/negative sign
            negate() {
                if (this.currentOperand === '0' || this.currentOperand === 'Error') return;
                if (this.currentOperand.startsWith('-')) {
                    this.currentOperand = this.currentOperand.slice(1);
                } else {
                    this.currentOperand = '-' + this.currentOperand;
                }
            }

            // Convert current number to percentage
            percent() {
                if (this.currentOperand === 'Error') return;
                const current = parseFloat(this.currentOperand);
                if (isNaN(current)) return;
                this.currentOperand = this.formatResult(current / 100).toString();
            }

            // Select mathematical operation
            chooseOperation(operation) {
                if (this.currentOperand === 'Error') return;
                
                // If user changes operator before entering second number
                if (this.operation !== undefined && this.shouldResetScreen) {
                    this.operation = operation;
                    return;
                }

                if (this.previousOperand !== '') {
                    this.compute();
                }

                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.shouldResetScreen = true;
            }

            // Perform calculation
            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                
                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            this.currentOperand = 'Error';
                            this.previousOperand = '';
                            this.operation = undefined;
                            this.shouldResetScreen = true;
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                const formattedResult = this.formatResult(computation);
                
                // Save to history
                this.addToHistory(`${this.getDisplayNumber(prev)} ${this.operation} ${this.getDisplayNumber(current)}`, formattedResult);

                this.currentOperand = formattedResult.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.shouldResetScreen = true;
            }

            // Avoid floating point precision issues (e.g., 0.1 + 0.2 = 0.30000000000000004)
            formatResult(number) {
                if (!isFinite(number)) return 'Error';
                return Math.round(number * 1e10) / 1e10;
            }

            // Format number with commas for display
            getDisplayNumber(number) {
                if (number === 'Error') return 'Cannot divide by 0';
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                
                let integerDisplay;
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
                }

                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            // Update DOM elements
            updateDisplay() {
                this.currentOperandTextElement.innerText = this.getDisplayNumber(this.currentOperand);
                
                // Adjust font size dynamically for long numbers
                const length = this.currentOperandTextElement.innerText.length;
                if (length > 12) {
                    this.currentOperandTextElement.classList.add('compact');
                } else {
                    this.currentOperandTextElement.classList.remove('compact');
                }

                if (this.operation != null) {
                    this.previousOperandTextElement.innerText = `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandTextElement.innerText = '';
                }
            }

            // History management
            addToHistory(expression, result) {
                this.history.unshift({ expression, result });
                if (this.history.length > 20) this.history.pop();
                this.renderHistory();
            }

            clearHistory() {
                this.history = [];
                this.renderHistory();
            }

            renderHistory() {
                const historyList = document.getElementById('history-list');
                if (this.history.length === 0) {
                    historyList.innerHTML = '<li class="history-empty">No history yet</li>';
                    return;
                }

                historyList.innerHTML = this.history.map((item, index) => `
                    <li class="history-item" onclick="loadFromHistory(${index})">
                        <div class="history-expr">${item.expression} =</div>
                        <div class="history-res">${this.getDisplayNumber(item.result)}</div>
                    </li>
                `).join('');
            }
        }

        // --- Initialization & Event Listeners ---
        const previousOperandTextElement = document.getElementById('previous-operand');
        const currentOperandTextElement = document.getElementById('current-operand');
        const calculator = new Calculator(previousOperandTextElement, currentOperandTextElement);

        // Load result from history item click
        window.loadFromHistory = function(index) {
            const item = calculator.history[index];
            if (item) {
                calculator.currentOperand = item.result.toString();
                calculator.shouldResetScreen = true;
                calculator.updateDisplay();
            }
        };

        // Number buttons
        document.querySelectorAll('[data-number]').forEach(button => {
            button.addEventListener('click', () => {
                calculator.appendNumber(button.dataset.number);
                calculator.updateDisplay();
            });
        });

        // Operation buttons
        document.querySelectorAll('[data-operation]').forEach(button => {
            button.addEventListener('click', () => {
                calculator.chooseOperation(button.dataset.operation);
                calculator.updateDisplay();
            });
        });

        // Action buttons
        document.querySelectorAll('[data-action]').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.dataset.action;
                if (action === 'clear') calculator.clear();
                if (action === 'delete') calculator.delete();
                if (action === 'equals') calculator.compute();
                if (action === 'percent') calculator.percent();
                if (action === 'negate') calculator.negate();
                calculator.updateDisplay();
            });
        });

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                calculator.appendNumber(e.key);
                calculator.updateDisplay();
            } else if (e.key === '+' || e.key === '-') {
                calculator.chooseOperation(e.key);
                calculator.updateDisplay();
            } else if (e.key === '*' || e.key === 'x' || e.key === 'X') {
                calculator.chooseOperation('×');
                calculator.updateDisplay();
            } else if (e.key === '/') {
                e.preventDefault(); // Prevent quick find in Firefox
                calculator.chooseOperation('÷');
                calculator.updateDisplay();
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculator.compute();
                calculator.updateDisplay();
            } else if (e.key === 'Backspace') {
                calculator.delete();
                calculator.updateDisplay();
            } else if (e.key === 'Escape' || e.key === 'Delete') {
                calculator.clear();
                calculator.updateDisplay();
            } else if (e.key === '%') {
                calculator.percent();
                calculator.updateDisplay();
            }
        });

        // Copy Display Value on Click
        currentOperandTextElement.addEventListener('click', () => {
            const textToCopy = calculator.currentOperand;
            if (textToCopy === 'Error') return;

            const tempInput = document.createElement('input');
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast('Copied to clipboard!');
            } catch (err) {
                console.error('Failed to copy text', err);
            }
            document.body.removeChild(tempInput);
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        // Theme Toggle (Light / Dark Mode)
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // History Drawer Toggle
        const historyToggleBtn = document.getElementById('history-toggle');
        const historyPanel = document.getElementById('history-panel');
        historyToggleBtn.addEventListener('click', () => {
            historyPanel.classList.toggle('open');
        });

        // Clear History Button
        document.getElementById('clear-history').addEventListener('click', () => {
            calculator.clearHistory();
        });
    </script>
</body>
</html>
